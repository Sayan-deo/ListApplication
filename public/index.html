<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A premium, interactive Todo application.">
  <title>Taskify - Premium Todo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Taskify</h1>
      <p>Manage your tasks efficiently.</p>
    </header>
    
    <main>
      <form id="todo-form" class="todo-form">
        <div class="input-group">
          <input type="text" id="todo-input" placeholder="What needs to be done?" required autocomplete="off">
          <input type="datetime-local" id="todo-date" class="date-input" aria-label="Due date">
        </div>
        <button type="submit" class="add-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </form>

      <div class="todo-list-container">
        <div class="list-header">
          <h2>Your Tasks</h2>
          <span id="task-count">0 tasks</span>
        </div>
        <ul id="todo-list" class="todo-list">
          <!-- Tasks will be injected here via JavaScript -->
        </ul>
        <div id="empty-state" class="empty-state hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <p>No tasks yet. Add one above!</p>
        </div>
      </div>
    </main>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
