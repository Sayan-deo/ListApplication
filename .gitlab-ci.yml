stages:
  - build
  - test

default:
  image: node:20-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint

unit_test:
  stage: test

  script:
    - npm ci --cache .npm --prefer-offline
    - npm test